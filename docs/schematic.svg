<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">
  <title>ESP32 CD-i controller wiring</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fff"/>

  <!-- ESP32 -->
  <rect x="30" y="20" width="150" height="290" rx="6" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
  <text x="50" y="150" font-weight="bold">ESP32</text>
  <text x="50" y="170" font-size="12">DevKit</text>
  <g font-family="Menlo, monospace" font-size="13" text-anchor="end">
    <text x="172" y="84">GPIO17</text>
    <text x="172" y="154">GPIO16</text>
    <text x="172" y="214">3V3</text>
    <text x="172" y="244">GND</text>
  </g>

  <!-- level shifter: LV pins on the left, HV pins on the right, a GND on each side -->
  <rect x="290" y="60" width="150" height="210" rx="6" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
  <text x="365" y="126" text-anchor="middle" font-weight="bold">Level shifter</text>
  <text x="365" y="144" text-anchor="middle" font-size="12">3.3 V / 5 V</text>
  <g font-family="Menlo, monospace" font-size="12">
    <text x="298" y="84">LV1</text>
    <text x="298" y="154">LV2</text>
    <text x="298" y="214">LV</text>
    <text x="298" y="244">GND</text>
  </g>
  <g font-family="Menlo, monospace" font-size="12" text-anchor="end">
    <text x="432" y="84">HV1</text>
    <text x="432" y="154">HV2</text>
    <text x="432" y="214">HV</text>
    <text x="432" y="244">GND</text>
  </g>

  <!-- CD-i socket, pins in numerical order -->
  <rect x="560" y="20" width="170" height="290" rx="6" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
  <text x="645" y="262" text-anchor="middle" font-weight="bold">CD-i socket</text>
  <text x="645" y="280" text-anchor="middle" font-size="12">8-pin mini-DIN</text>
  <g font-family="Menlo, monospace" font-size="12">
    <text x="568" y="84">pin 2</text>
    <text x="568" y="122">pin 5</text>
    <text x="568" y="154">pin 7</text>
    <text x="568" y="214">pin 8</text>
  </g>

  <g stroke="#222" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- GPIO17 -> pin 2 -->
    <line x1="180" y1="80" x2="290" y2="80" marker-end="url(#arrow)"/>
    <line x1="440" y1="80" x2="560" y2="80" marker-end="url(#arrow)"/>
    <!-- pin 7 -> GPIO16 -->
    <line x1="560" y1="150" x2="440" y2="150" marker-end="url(#arrow)"/>
    <line x1="290" y1="150" x2="180" y2="150" marker-end="url(#arrow)"/>
    <!-- 3V3 -> LV -->
    <line x1="180" y1="210" x2="290" y2="210"/>
    <!-- CD-i pin 8 (5 V) -> HV reference only -->
    <line x1="560" y1="210" x2="440" y2="210"/>
    <!-- ESP32 GND -> LV side GND -->
    <line x1="180" y1="240" x2="290" y2="240"/>
    <!-- CD-i pin 5 (GND) -> HV side GND -->
    <line x1="560" y1="118" x2="500" y2="118"/>
    <line x1="500" y1="118" x2="500" y2="240"/>
    <line x1="500" y1="240" x2="440" y2="240"/>
  </g>

  <text x="235" y="72" text-anchor="middle" font-size="12">3.3 V</text>
  <text x="235" y="142" text-anchor="middle" font-size="12">3.3 V</text>
  <text x="235" y="202" text-anchor="middle" font-size="12">3.3 V</text>
  <text x="235" y="232" text-anchor="middle" font-size="12">GND</text>
  <text x="470" y="72" text-anchor="middle" font-size="12">5 V</text>
  <text x="470" y="142" text-anchor="middle" font-size="12">5 V</text>
  <text x="470" y="202" text-anchor="middle" font-size="12">5 V</text>
  <text x="530" y="110" text-anchor="middle" font-size="12">GND</text>
</svg>
